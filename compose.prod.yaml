services:
    web:
        build:
            context: .
            dockerfile: ./docker/production/nginx/Dockerfile
        restart: unless-stopped
        volumes:
            - laravel-storage-production:/var/www/storage:ro
            - laravel-public-assets:/var/www/public/build:ro
        networks:
            - laravel-production
        ports:
            - '${NGINX_PORT:-80}:80'
        depends_on:
            laravel:
                condition: service_started

    laravel:
        build:
            context: .
            dockerfile: ./docker/production/php-fpm/Dockerfile
            target: production
        restart: unless-stopped
        volumes:
            - laravel-storage-production:/var/www/storage
        env_file:
            - .env
        networks:
            - laravel-production
        healthcheck:
            test: ['CMD-SHELL', 'php-fpm-healthcheck || exit 1']
            interval: 30s
            timeout: 10s
            retries: 5
        depends_on:
            mysql:
                condition: service_healthy

    mysql:
        image: mysql:26.7
        restart: unless-stopped
        ports:
            - '${MYSQL_PORT:-3306}:3306'
        env_file:
            - .env
        environment:
            - MYSQL_DATABASE=${DB_DATABASE}
            - MYSQL_USER=${DB_USERNAME}
            - MYSQL_PASSWORD=${DB_PASSWORD}
            - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
        volumes:
            - mysql-data-production:/var/lib/mysql
        networks:
            - laravel-production
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', '${DB_USERNAME}', '-p${DB_PASSWORD}']
            interval: 10s
            timeout: 5s
            retries: 5

networks:
    laravel-production:

volumes:
    mysql-data-production:
    laravel-storage-production:
    laravel-public-assets:
